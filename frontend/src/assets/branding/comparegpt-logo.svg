<svg xmlns="http://www.w3.org/2000/svg" width="276" height="180" viewBox="0 0 320 200" fill="none">
  <!-- CompareGPT Logo - Black version -->
  <defs>
    <!-- Black gradient for all elements -->
    <linearGradient id="blackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="100%" style="stop-color:#000000"/>
    </linearGradient>
  </defs>

  <g transform="translate(160,80)">
    <!-- Spiral arms - black version -->
    <!-- Spiral arms (top-left) -->
    <path d="M -50 -10 A 60 60 0 0 1 -10 -50" stroke="#000000" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M -35 -5 A 40 40 0 0 1 -5 -35" stroke="#000000" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Spiral arms (top-right) -->
    <path d="M 10 -50 A 60 60 0 0 1 50 -10" stroke="#000000" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 5 -35 A 40 40 0 0 1 35 -5" stroke="#000000" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Spiral arms (right) -->
    <path d="M 50 10 A 60 60 0 0 1 10 50" stroke="#000000" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 35 5 A 40 40 0 0 1 5 35" stroke="#000000" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Spiral arms (bottom) -->
    <path d="M -10 50 A 60 60 0 0 1 -50 10" stroke="#000000" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M -5 35 A 40 40 0 0 1 -35 5" stroke="#000000" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Spiral arms (bottom-left) -->
    <path d="M -50 -10 A 60 60 0 0 0 -10 50" stroke="#000000" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M -35 -5 A 40 40 0 0 0 -5 35" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- Spiral arms (left to top) -->
    <path d="M 10 50 A 60 60 0 0 0 50 -10" stroke="#000000" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M 5 35 A 40 40 0 0 0 35 -5" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- Center icon - black version -->
    <circle cx="0" cy="0" r="22" fill="#000000"/>
    <!-- Center details - black -->
    <path d="M -15 -8 Q -8 -12 0 -8 Q 8 -5 15 -8 Q 12 2 8 8 Q 0 12 -8 8 Q -15 3 -15 -8 Z" fill="#000000"/>
    <path d="M -10 3 Q -3 0 3 3 Q 10 6 8 12 Q 0 15 -6 12 Q -10 9 -10 3 Z" fill="#000000"/>
    <ellipse cx="6" cy="-6" rx="6" ry="4" fill="#000000"/>
    <ellipse cx="-8" cy="2" rx="4" ry="3" fill="#000000"/>

    <!-- Highlight - black -->
    <ellipse cx="-8" cy="-8" rx="3" ry="2" fill="#000000" opacity="0.6"/>
  </g>

  <!-- CompareGPT text - black version -->
  <text x="160" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#000000">CompareGPT</text>
</svg>
