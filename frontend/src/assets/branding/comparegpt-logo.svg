<svg xmlns="http://www.w3.org/2000/svg" width="47" height="30" viewBox="0 0 400 400" fill="none">
  <!-- CompareGPT Logo - Colorful spiral with earth in center -->
  <g transform="translate(200,200)">
    <!-- Outer spiral arcs - Green to Blue -->
    <path d="M -120 0 A 120 120 0 0 1 0 -120" stroke="#4CAF50" stroke-width="12" fill="none"/>
    <path d="M 0 -120 A 120 120 0 0 1 120 0" stroke="#8BC34A" stroke-width="12" fill="none"/>
    <path d="M 120 0 A 120 120 0 0 1 0 120" stroke="#2196F3" stroke-width="12" fill="none"/>
    <path d="M 0 120 A 120 120 0 0 1 -120 0" stroke="#03A9F4" stroke-width="12" fill="none"/>
    
    <!-- Middle spiral arcs - Yellow to Purple -->
    <path d="M -90 0 A 90 90 0 0 1 0 -90" stroke="#FFEB3B" stroke-width="10" fill="none"/>
    <path d="M 0 -90 A 90 90 0 0 1 90 0" stroke="#FFC107" stroke-width="10" fill="none"/>
    <path d="M 90 0 A 90 90 0 0 1 0 90" stroke="#9C27B0" stroke-width="10" fill="none"/>
    <path d="M 0 90 A 90 90 0 0 1 -90 0" stroke="#673AB7" stroke-width="10" fill="none"/>
    
    <!-- Inner spiral arcs - Orange to Red -->
    <path d="M -60 0 A 60 60 0 0 1 0 -60" stroke="#FF9800" stroke-width="8" fill="none"/>
    <path d="M 0 -60 A 60 60 0 0 1 60 0" stroke="#FF5722" stroke-width="8" fill="none"/>
    <path d="M 60 0 A 60 60 0 0 1 0 60" stroke="#F44336" stroke-width="8" fill="none"/>
    <path d="M 0 60 A 60 60 0 0 1 -60 0" stroke="#E91E63" stroke-width="8" fill="none"/>
    
    <!-- Earth in center -->
    <circle cx="0" cy="0" r="35" fill="#1976D2"/>
    <!-- Continents on earth -->
    <path d="M -20 -15 Q -10 -20 0 -15 Q 10 -10 20 -15 Q 15 0 10 10 Q 0 15 -10 10 Q -20 5 -20 -15 Z" fill="#4CAF50"/>
    <path d="M -15 5 Q -5 0 5 5 Q 15 10 10 20 Q 0 25 -10 20 Q -15 15 -15 5 Z" fill="#8BC34A"/>
    <ellipse cx="8" cy="-8" rx="8" ry="5" fill="#2E7D32"/>
  </g>
  
  <!-- CompareGPT text -->
  <text x="200" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#333333">CompareGPT</text>
</svg>